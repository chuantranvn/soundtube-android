name: Build & Deploy APK to Supabase

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signature
        run: |
          APK_PATH="app/build/outputs/apk/release/QuarkTube-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi
          echo "Release APK found: $(ls -lh $APK_PATH)"

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ] || [ -z "$SUPABASE_BUCKET" ]; then
            echo "::error::Missing Supabase secrets. Please configure SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and SUPABASE_BUCKET in repository Secrets."
            exit 1
          fi

          APK_PATH="app/build/outputs/apk/release/QuarkTube-release.apk"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Lấy ngày giờ theo múi giờ Việt Nam (GMT+7)
          BUILD_DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d_%Hh%M')

          # 1. Upload file cố định luôn là bản mới nhất
          echo "Uploading QuarkTube-release.apk to Supabase..."
          RESPONSE_LATEST=$(curl -s -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/QuarkTube-release.apk" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${APK_PATH}")

          HTTP_CODE=$(echo "$RESPONSE_LATEST" | tail -n1)
          BODY=$(echo "$RESPONSE_LATEST" | sed '$d')

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Upload failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
          echo "Upload QuarkTube-release.apk succeeded: $BODY"

          # 2. Upload file có ngày tháng giờ theo dạng: QuarkTube-2026-09-17_10h35-3e8db85.apk
          VERSIONED_NAME="QuarkTube-${BUILD_DATE}-${SHORT_SHA}.apk"
          echo "Uploading $VERSIONED_NAME to Supabase..."
          curl -s -X POST \
            "${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${VERSIONED_NAME}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${APK_PATH}"

          # In link download ra trang kết quả Actions
          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/QuarkTube-release.apk"
          echo "### 🚀 APK Uploaded to Supabase Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL (Latest):** [Download QuarkTube-release.apk](${PUBLIC_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned File:** \`${VERSIONED_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $(du -h $APK_PATH | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK as GitHub Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: QuarkTube-release-apk
          path: app/build/outputs/apk/release/QuarkTube-release.apk
          if-no-files-found: error
